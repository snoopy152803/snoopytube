<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnoopyTube</title>
<meta name="description" content="A YouTube-style site where Snoopy learns what you like and fetches videos for you. Real YouTube videos, recommendations made in your browser.">
<meta property="og:title" content="SnoopyTube">
<meta property="og:description" content="Snoopy fetches YouTube videos based on what you watch.">
<meta property="og:url" content="https://snoopytube.vercel.app/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SnoopyTube">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="hleft">
    <button class="iconbtn" id="menuBtn" title="Menu"><svg viewBox="0 0 24 24"><path d="M21 6H3V5h18v1zm0 5H3v1h18v-1zm0 6H3v1h18v-1z"/></svg></button>
    <a class="logo" href="/"><img src="/icons/logo.png" alt="" width="32" height="32"><span>Snoopy<em>Tube</em></span></a>
  </div>
  <div class="hcenter">
    <form class="search" id="searchForm">
      <input id="searchInput" type="text" placeholder="Search" autocomplete="off">
      <button type="submit" title="Search"><svg viewBox="0 0 24 24"><path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg></button>
    </form>
  </div>
  <div class="hright">
    <button class="iconbtn searchtoggle" id="searchToggle" title="Search" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg></button>
    <button class="iconbtn" title="Notifications"><svg viewBox="0 0 24 24"><path d="M10 20h4c0 1.1-.9 2-2 2s-2-.9-2-2zm10-2.65V19H4v-1.65l2-1.88v-5.15C6 7.4 7.56 5.1 10 4.34v-.38c0-1.42 1.49-2.5 2.99-1.76.65.32 1.01 1.03 1.01 1.76v.39c2.44.75 4 3.06 4 5.98v5.15l2 1.87zm-1 .42-2-1.88v-5.47c0-2.47-1.19-4.36-3.13-5.1-1.26-.53-2.64-.5-3.84.03C8.15 6.11 7 7.99 7 10.42v5.47l-2 1.88V18h14v-.23z"/></svg></button>
    <button class="pill addbtn" data-addvideo title="Add any YouTube video"><svg viewBox="0 0 24 24"><path d="M20 12h-8v8h-1v-8H3v-1h8V3h1v8h8v1z"/></svg><span>Add video</span></button>
    <div id="installBox"></div>
    <div id="authBox"></div>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<nav id="nav"></nav>
<div class="tabbar" id="tabbar"></div>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="dialogbg" id="dialog"></div>

</body>
</html>
